name: TPC-DS Benchmark with JDK 25

on:
  push:
    branches:
      - main
      - spark
  workflow_dispatch:

jobs:
  tpcds-benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 6 hours

    steps:
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache SBT and Ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.m2/repository
          key: ${{ runner.os }}-sbt-spark-java25
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Clone and build Apache Spark (java25 branch)
        run: |
          echo "Cloning Spark from java25 branch..."
          git clone --depth 1 --branch java25 https://github.com/wangyum/spark.git spark-src

          echo "Building Spark with JDK 25..."
          cd spark-src

          # Build Spark with SBT and create test jars
          ./build/sbt clean package Test/packageBin

          echo "Spark build completed"

      - name: Download TPC-DS 5GB dataset
        run: |
          echo "Downloading pre-generated TPC-DS 5GB dataset..."
          wget https://github.com/wangyum/tpcds-benchmark/raw/master/tpcds_5GB.tgz

          echo "Extracting dataset..."
          tar -xzf tpcds_5GB.tgz

          echo "Dataset extracted"
          ls -lh tpcds_5GB/

      - name: Run both benchmarks in parallel (G1GC vs ZGC)
        run: |
          export TPCDS_DATA=$(pwd)/tpcds_5GB

          cd spark-src

          # Find all necessary test jars
          echo "Finding test jars..."
          SPARK_CORE_TEST_JAR=$(ls core/target/scala-2.13/spark-core_2.13-*-tests.jar 2>/dev/null | head -1)
          SPARK_CATALYST_TEST_JAR=$(ls sql/catalyst/target/scala-2.13/spark-catalyst_2.13-*-tests.jar 2>/dev/null | head -1)
          SPARK_SQL_TEST_JAR=$(ls sql/core/target/scala-2.13/spark-sql_2.13-*-tests.jar 2>/dev/null | head -1)

          echo "Test jars found:"
          echo "  SPARK_CORE_TEST_JAR=$SPARK_CORE_TEST_JAR"
          echo "  SPARK_CATALYST_TEST_JAR=$SPARK_CATALYST_TEST_JAR"
          echo "  SPARK_SQL_TEST_JAR=$SPARK_SQL_TEST_JAR"

          # Verify required jars exist
          if [ -z "$SPARK_SQL_TEST_JAR" ] || [ ! -f "$SPARK_SQL_TEST_JAR" ]; then
            echo "ERROR: spark-sql test jar not found!"
            find sql/core/target -name "*.jar" | head -10
            exit 1
          fi

          # Build comma-separated jars list
          JARS_LIST=""
          if [ -n "$SPARK_CORE_TEST_JAR" ] && [ -f "$SPARK_CORE_TEST_JAR" ]; then
            JARS_LIST="$SPARK_CORE_TEST_JAR"
          fi
          if [ -n "$SPARK_CATALYST_TEST_JAR" ] && [ -f "$SPARK_CATALYST_TEST_JAR" ]; then
            if [ -n "$JARS_LIST" ]; then
              JARS_LIST="$JARS_LIST,$SPARK_CATALYST_TEST_JAR"
            else
              JARS_LIST="$SPARK_CATALYST_TEST_JAR"
            fi
          fi

          echo "Using jars: $JARS_LIST"

          # G1GC benchmark in background
          (
            echo "========================================"
            echo "TPC-DS Benchmark - G1GC"
            echo "========================================"
            echo "Start: $(date)"

            ./bin/spark-submit \
              --master local[*] \
              --driver-memory 4g \
              --conf spark.driver.extraJavaOptions="-XX:+UseG1GC -Dlog4j.rootCategory=WARN,console" \
              --jars "$JARS_LIST" \
              --class org.apache.spark.sql.execution.benchmark.TPCDSQueryBenchmark \
              "$SPARK_SQL_TEST_JAR" \
              --data-location "$TPCDS_DATA" \
              --query-filter "q3,q7,q19,q27,q42,q43,q52,q55,q63,q65,q68,q73,q79,q96"

            echo "End: $(date)"
          ) > ../benchmark-g1gc.log 2>&1 &
          G1GC_PID=$!
          echo "G1GC benchmark started with PID $G1GC_PID"

          # ZGC benchmark in background
          (
            echo "========================================"
            echo "TPC-DS Benchmark - ZGC"
            echo "========================================"
            echo "Start: $(date)"

            ./bin/spark-submit \
              --master local[*] \
              --driver-memory 4g \
              --conf spark.driver.extraJavaOptions="-XX:+UseZGC -Dlog4j.rootCategory=WARN,console" \
              --jars "$JARS_LIST" \
              --class org.apache.spark.sql.execution.benchmark.TPCDSQueryBenchmark \
              "$SPARK_SQL_TEST_JAR" \
              --data-location "$TPCDS_DATA" \
              --query-filter "q3,q7,q19,q27,q42,q43,q52,q55,q63,q65,q68,q73,q79,q96"

            echo "End: $(date)"
          ) > ../benchmark-zgc.log 2>&1 &
          ZGC_PID=$!
          echo "ZGC benchmark started with PID $ZGC_PID"

          # Monitor both processes
          echo ""
          echo "Both benchmarks running in parallel..."
          echo "G1GC PID: $G1GC_PID"
          echo "ZGC PID: $ZGC_PID"

          # Wait for both to complete
          wait $G1GC_PID
          G1GC_EXIT=$?
          echo "G1GC benchmark completed with exit code: $G1GC_EXIT"

          wait $ZGC_PID
          ZGC_EXIT=$?
          echo "ZGC benchmark completed with exit code: $ZGC_EXIT"

          # Show summary
          echo ""
          echo "========================================"
          echo "Benchmark Execution Summary"
          echo "========================================"
          echo "G1GC exit code: $G1GC_EXIT"
          echo "ZGC exit code: $ZGC_EXIT"

          # Exit with error if either failed
          if [ $G1GC_EXIT -ne 0 ] || [ $ZGC_EXIT -ne 0 ]; then
            echo "One or more benchmarks failed"
            exit 1
          fi

      - name: Checkout code for comparison script
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Compare G1GC vs ZGC results
        if: always()
        run: |
          echo "========================================"
          echo "Comparing G1GC vs ZGC Results"
          echo "========================================"

          # The logs are in the workspace root, comparison script expects specific names
          # Copy files with the expected names for comparison script
          if [ -f benchmark-g1gc.log ]; then
            cp benchmark-g1gc.log benchmark-baseline.log
            echo "✅ G1GC results found"
          else
            echo "WARNING: benchmark-g1gc.log not found"
            ls -la benchmark*.log 2>/dev/null || echo "No benchmark logs found"
          fi

          if [ -f benchmark-zgc.log ]; then
            cp benchmark-zgc.log benchmark-optimized.log
            echo "✅ ZGC results found"
          else
            echo "WARNING: benchmark-zgc.log not found"
            ls -la benchmark*.log 2>/dev/null || echo "No benchmark logs found"
          fi

          # Run the comparison analysis
          python3 .github/scripts/compare_results.py | tee comparison_output.txt

      - name: Upload benchmark results and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpcds-gc-comparison-${{ github.sha }}
          path: |
            benchmark-g1gc.log
            benchmark-zgc.log
            comparison_output.txt
            comparison_results.txt
          retention-days: 30
