name: Spark SQL Performance Benchmark

on:
  push:
    branches:
      - main
      - spark
    paths:
      - 'src/**'
      - '.github/workflows/spark-benchmark.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      benchmark_scale:
        description: 'Benchmark scale factor (small/medium/large)'
        required: false
        default: 'small'
        type: choice
        options:
          - small
          - medium
          - large

jobs:
  build-jdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120  # 2 hours for JDK build
    outputs:
      jdk-artifact: ${{ steps.upload-jdk.outputs.artifact-id }}

    steps:
      - name: Checkout JDK code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install JDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            zip \
            unzip \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libpng-dev \
            ccache

      - name: Install Bootstrap JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Boot JDK path
        run: |
          # Find the actual boot JDK path (wildcard expansion)
          BOOT_JDK=$(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk -maxdepth 2 -type d -name "x64" | head -1)
          echo "BOOT_JDK=$BOOT_JDK" >> $GITHUB_ENV
          echo "Boot JDK found at: $BOOT_JDK"
          $BOOT_JDK/bin/java -version

      - name: Configure JDK build
        run: |
          bash configure \
            --with-boot-jdk=$BOOT_JDK \
            --with-native-debug-symbols=none \
            --with-debug-level=release \
            --with-version-opt="spark-optimized" \
            --disable-warnings-as-errors

      - name: Build JDK
        run: |
          make images
          echo "JDK_HOME=$(pwd)/build/linux-x86_64-server-release/images/jdk" >> $GITHUB_ENV

      - name: Verify JDK build completeness
        run: |
          echo "Checking critical JDK files..."

          # Check java executable
          if [ ! -f "$JDK_HOME/bin/java" ]; then
            echo "ERROR: java executable not found!"
            exit 1
          fi

          # Check modules file (critical!)
          if [ ! -f "$JDK_HOME/lib/modules" ]; then
            echo "ERROR: lib/modules file not found!"
            echo "JDK build is incomplete. This file is required for the JDK to function."
            ls -lR $JDK_HOME/lib/ || true
            exit 1
          fi

          # Check jvm.cfg
          if [ ! -f "$JDK_HOME/lib/jvm.cfg" ] && [ ! -L "$JDK_HOME/lib/jvm.cfg" ]; then
            echo "ERROR: lib/jvm.cfg not found!"
            exit 1
          fi

          # Check libjvm.so
          if [ ! -f "$JDK_HOME/lib/server/libjvm.so" ]; then
            echo "ERROR: lib/server/libjvm.so not found!"
            exit 1
          fi

          echo "✅ All critical files present"
          ls -lh $JDK_HOME/lib/modules
          ls -lh $JDK_HOME/lib/jvm.cfg
          ls -lh $JDK_HOME/lib/server/libjvm.so

      - name: Verify JDK runs
        run: |
          $JDK_HOME/bin/java -version

      - name: Check Spark optimization flags
        run: |
          echo "Verifying Spark optimization flags..."
          $JDK_HOME/bin/java -XX:+UnlockExperimentalVMOptions -XX:+PrintFlagsFinal -version 2>&1 | grep "G1OptimizeForSpark"
          $JDK_HOME/bin/java -XX:+UnlockExperimentalVMOptions -XX:+PrintFlagsFinal -version 2>&1 | grep "G1Spark" | head -20

      - name: Upload JDK artifact
        id: upload-jdk
        uses: actions/upload-artifact@v4
        with:
          name: jdk-build-${{ github.sha }}
          path: build/linux-x86_64-server-release/images/jdk/
          retention-days: 1

  build-spark:
    runs-on: ubuntu-22.04
    timeout-minutes: 120  # 2 hours for Spark build
    needs: [build-jdk]
    outputs:
      spark-artifact: ${{ steps.upload-spark.outputs.artifact-id }}

    steps:
      - name: Download JDK
        uses: actions/download-artifact@v4
        with:
          name: jdk-build-${{ github.sha }}
          path: jdk

      - name: Cache SBT and Ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.m2/repository
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Clone and build Apache Spark (java25 branch)
        run: |
          export JAVA_HOME=$(pwd)/jdk
          export PATH=$JAVA_HOME/bin:$PATH

          echo "Cloning Spark from java25 branch..."
          git clone --depth 1 --branch java25 https://github.com/wangyum/spark.git spark-src

          echo "Building Spark with custom JDK..."
          cd spark-src

          # Build Spark (this will take a while)
          ./build/sbt -Dscala.version=2.13.15 -DskipTests clean package

          echo "Spark build completed"

      - name: Upload Spark artifact
        id: upload-spark
        uses: actions/upload-artifact@v4
        with:
          name: spark-build-${{ github.sha }}
          path: spark-src/
          retention-days: 1

  download-dataset:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      dataset-artifact: ${{ steps.upload-dataset.outputs.artifact-id }}
    steps:
      - name: Download TPC-DS 5GB dataset
        run: |
          echo "Downloading pre-generated TPC-DS 5GB dataset..."
          wget https://github.com/wangyum/tpcds-benchmark/raw/master/tpcds_5GB.tgz

          echo "Extracting dataset..."
          tar -xzf tpcds_5GB.tgz

          echo "Dataset extracted"
          ls -lh tpcds_5GB/

      - name: Upload dataset artifact
        id: upload-dataset
        uses: actions/upload-artifact@v4
        with:
          name: tpcds-dataset-${{ github.sha }}
          path: tpcds_5GB/
          retention-days: 1

  run-baseline-benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 6 hours
    needs: [build-jdk, build-spark, download-dataset]
    steps:
      - name: Download JDK
        uses: actions/download-artifact@v4
        with:
          name: jdk-build-${{ github.sha }}
          path: jdk

      - name: Download Spark
        uses: actions/download-artifact@v4
        with:
          name: spark-build-${{ github.sha }}
          path: spark-src

      - name: Download TPC-DS dataset
        uses: actions/download-artifact@v4
        with:
          name: tpcds-dataset-${{ github.sha }}
          path: tpcds_5GB

      - name: Run BASELINE benchmark
        run: |
          export JAVA_HOME=$(pwd)/jdk
          export PATH=$JAVA_HOME/bin:$PATH
          export TPCDS_DATA=$(pwd)/tpcds_5GB

          cd spark-src

          # Restore execute permissions (artifacts don't preserve permissions)
          chmod +x build/sbt

          echo "========================================" | tee ../benchmark-baseline.log
          echo "TPC-DS Benchmark - BASELINE (Standard JDK)" | tee -a ../benchmark-baseline.log
          echo "========================================" | tee -a ../benchmark-baseline.log
          echo "Start: $(date)" | tee -a ../benchmark-baseline.log

          export JAVA_OPTS="-Xmx4g -XX:+UseG1GC"

          ./build/sbt "sql/Test/runMain org.apache.spark.sql.execution.benchmark.TPCDSQueryBenchmark --data-location $TPCDS_DATA --query-filter q3,q7,q19,q27,q42,q43,q52,q55,q63,q65,q68,q73,q79,q96" 2>&1 | tee -a ../benchmark-baseline.log

          echo "End: $(date)" | tee -a ../benchmark-baseline.log

      - name: Upload baseline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-results-${{ github.sha }}
          path: benchmark-baseline.log
          retention-days: 30

  run-optimized-benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 6 hours
    needs: [build-jdk, build-spark, download-dataset]
    steps:
      - name: Download JDK
        uses: actions/download-artifact@v4
        with:
          name: jdk-build-${{ github.sha }}
          path: jdk

      - name: Download Spark
        uses: actions/download-artifact@v4
        with:
          name: spark-build-${{ github.sha }}
          path: spark-src

      - name: Download TPC-DS dataset
        uses: actions/download-artifact@v4
        with:
          name: tpcds-dataset-${{ github.sha }}
          path: tpcds_5GB

      - name: Run OPTIMIZED benchmark
        run: |
          export JAVA_HOME=$(pwd)/jdk
          export PATH=$JAVA_HOME/bin:$PATH
          export TPCDS_DATA=$(pwd)/tpcds_5GB

          cd spark-src

          # Restore execute permissions (artifacts don't preserve permissions)
          chmod +x build/sbt

          echo "========================================" | tee ../benchmark-optimized.log
          echo "TPC-DS Benchmark - OPTIMIZED (Spark Optimizations)" | tee -a ../benchmark-optimized.log
          echo "========================================" | tee -a ../benchmark-optimized.log
          echo "Start: $(date)" | tee -a ../benchmark-optimized.log

          export JAVA_OPTS="-Xmx4g -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:+G1OptimizeForSpark -XX:+G1SparkEnhanceEscapeAnalysis -XX:+G1SparkOptimizeHashOperations -XX:+G1SparkEnableVectorization"

          ./build/sbt "sql/Test/runMain org.apache.spark.sql.execution.benchmark.TPCDSQueryBenchmark --data-location $TPCDS_DATA --query-filter q3,q7,q19,q27,q42,q43,q52,q55,q63,q65,q68,q73,q79,q96" 2>&1 | tee -a ../benchmark-optimized.log

          echo "End: $(date)" | tee -a ../benchmark-optimized.log

      - name: Upload optimized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimized-results-${{ github.sha }}
          path: benchmark-optimized.log
          retention-days: 30

  compare-results:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [run-baseline-benchmark, run-optimized-benchmark]
    if: always()
    steps:
      - name: Checkout code for comparison script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download baseline results
        uses: actions/download-artifact@v4
        with:
          name: baseline-results-${{ github.sha }}
        continue-on-error: true

      - name: Download optimized results
        uses: actions/download-artifact@v4
        with:
          name: optimized-results-${{ github.sha }}
        continue-on-error: true

      - name: Analyze and compare benchmark results
        if: always()
        run: |
          echo "========================================"
          echo "Analyzing Benchmark Results"
          echo "========================================"

          # Check if both log files exist
          if [ ! -f benchmark-baseline.log ]; then
            echo "WARNING: baseline results not found"
          fi

          if [ ! -f benchmark-optimized.log ]; then
            echo "WARNING: optimized results not found"
          fi

          # Run the analysis
          python3 .github/scripts/compare_results.py | tee comparison_output.txt

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison-${{ github.sha }}
          path: |
            benchmark-baseline.log
            benchmark-optimized.log
            comparison_output.txt
            comparison_results.txt
            compare_results.py
          retention-days: 30
