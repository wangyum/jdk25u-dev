name: Spark SQL Performance Benchmark

on:
  push:
    branches:
      - main
      - spark
    paths:
      - 'src/**'
      - '.github/workflows/spark-benchmark.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baseline_opts:
        description: 'Baseline JVM options (Standard G1GC)'
        required: false
        default: '-Xms3g -XX:+UseG1GC -XX:+AlwaysPreTouch'
        type: string
      optimized_opts:
        description: 'Optimized JVM options (G1GC + Spark optimizations) - DISABLED by default due to -2.5% regression'
        required: false
        default: '-Xms3g -XX:+UseG1GC -XX:+AlwaysPreTouch'
        type: string
      log_level:
        description: 'Spark log level (ERROR, WARN, INFO)'
        required: false
        default: 'ERROR'
        type: choice
        options:
          - ERROR
          - WARN
          - INFO
      query_filter:
        description: 'TPC-DS queries to run (comma-separated)'
        required: false
        default: 'q3,q4,q7,q19,q23a,q24a,q27,q42,q43,q52,q55,q63,q65,q67,q68,q73,q79,a95,q96'
        type: string

jobs:
  benchmark-pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 720  # 12 hours total (2h JDK + 2h Spark + 6h benchmarks + buffer)
    steps:
      - name: Set benchmark configuration
        run: |
          # Use workflow inputs if provided, otherwise use defaults
          BASELINE_OPTS="${{ github.event.inputs.baseline_opts || '-Xms3g -XX:+UseG1GC -XX:+AlwaysPreTouch' }}"
          # NOTE: Spark optimizations disabled by default due to -2.5% regression (q3: -43.9%)
          OPTIMIZED_OPTS="${{ github.event.inputs.optimized_opts || '-Xms3g -XX:+UseG1GC -XX:+AlwaysPreTouch' }}"
          LOG_LEVEL="${{ github.event.inputs.log_level || 'ERROR' }}"
          QUERY_FILTER="${{ github.event.inputs.query_filter || 'q3,q7,q19,q27,q42,q43,q52,q55,q63,q65,q68,q73,q79,q96' }}"

          echo "BASELINE_OPTS=$BASELINE_OPTS" >> $GITHUB_ENV
          echo "OPTIMIZED_OPTS=$OPTIMIZED_OPTS" >> $GITHUB_ENV
          echo "LOG_LEVEL=$LOG_LEVEL" >> $GITHUB_ENV
          echo "QUERY_FILTER=$QUERY_FILTER" >> $GITHUB_ENV

          echo "=========================================="
          echo "Benchmark Configuration"
          echo "=========================================="
          echo "Baseline opts:   $BASELINE_OPTS"
          echo "Optimized opts:  $OPTIMIZED_OPTS"
          echo "Log level:       $LOG_LEVEL"
          echo "Query filter:    $QUERY_FILTER"
          echo "=========================================="

      - name: Checkout JDK code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install JDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            zip \
            unzip \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libpng-dev \
            ccache

      - name: Install Bootstrap JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Boot JDK path
        run: |
          # Find the actual boot JDK path (wildcard expansion)
          BOOT_JDK=$(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk -maxdepth 2 -type d -name "x64" | head -1)
          echo "BOOT_JDK=$BOOT_JDK" >> $GITHUB_ENV
          echo "Boot JDK found at: $BOOT_JDK"
          $BOOT_JDK/bin/java -version

      - name: Configure JDK build
        run: |
          bash configure \
            --with-boot-jdk=$BOOT_JDK \
            --with-native-debug-symbols=none \
            --with-debug-level=release \
            --with-version-opt="spark-optimized" \
            --disable-warnings-as-errors

      - name: Build JDK
        run: |
          make images
          echo "JDK_HOME=$(pwd)/build/linux-x86_64-server-release/images/jdk" >> $GITHUB_ENV

      - name: Verify JDK build completeness
        run: |
          echo "Checking critical JDK files..."

          # Check java executable
          if [ ! -f "$JDK_HOME/bin/java" ]; then
            echo "ERROR: java executable not found!"
            exit 1
          fi

          # Check modules file (critical!)
          if [ ! -f "$JDK_HOME/lib/modules" ]; then
            echo "ERROR: lib/modules file not found!"
            echo "JDK build is incomplete. This file is required for the JDK to function."
            ls -lR $JDK_HOME/lib/ || true
            exit 1
          fi

          # Check jvm.cfg
          if [ ! -f "$JDK_HOME/lib/jvm.cfg" ] && [ ! -L "$JDK_HOME/lib/jvm.cfg" ]; then
            echo "ERROR: lib/jvm.cfg not found!"
            exit 1
          fi

          # Check libjvm.so
          if [ ! -f "$JDK_HOME/lib/server/libjvm.so" ]; then
            echo "ERROR: lib/server/libjvm.so not found!"
            exit 1
          fi

          echo "✅ All critical files present"
          ls -lh $JDK_HOME/lib/modules
          ls -lh $JDK_HOME/lib/jvm.cfg
          ls -lh $JDK_HOME/lib/server/libjvm.so

      - name: Verify JDK runs
        run: |
          $JDK_HOME/bin/java -version

      - name: Check Spark optimization flags
        run: |
          echo "Verifying Spark optimization flags..."
          $JDK_HOME/bin/java -XX:+UnlockExperimentalVMOptions -XX:+PrintFlagsFinal -version 2>&1 | grep "G1OptimizeForSpark"
          $JDK_HOME/bin/java -XX:+UnlockExperimentalVMOptions -XX:+PrintFlagsFinal -version 2>&1 | grep "G1Spark" | head -20

      - name: Cache SBT and Ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.m2/repository
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Clone and build Apache Spark (java25 branch)
        run: |
          export JAVA_HOME=$JDK_HOME
          export PATH=$JAVA_HOME/bin:$PATH

          echo "Cloning Spark from java25 branch..."
          git clone --depth 1 --branch java25 https://github.com/wangyum/spark.git spark-src

          echo "Building Spark with custom JDK..."
          cd spark-src

          # Build Spark with SBT and create test jars (without running tests)
          ./build/sbt clean package Test/packageBin

          echo "Spark build completed"

      - name: Download TPC-DS 5GB dataset
        run: |
          echo "Downloading pre-generated TPC-DS 5GB dataset..."
          wget https://github.com/wangyum/tpcds-benchmark/raw/master/tpcds_5GB.tgz

          echo "Extracting dataset..."
          tar -xzf tpcds_5GB.tgz

          echo "Dataset extracted"
          ls -lh tpcds_5GB/

      - name: Setup benchmark environment and validate test jars
        run: |
          export JAVA_HOME=$JDK_HOME
          export PATH=$JAVA_HOME/bin:$PATH
          export TPCDS_DATA=$(pwd)/tpcds_5GB

          cd spark-src

          # Find all necessary test jars
          echo "Finding test jars..."
          SPARK_CORE_TEST_JAR=$(ls core/target/scala-2.13/spark-core_2.13-*-tests.jar 2>/dev/null | head -1)
          SPARK_CATALYST_TEST_JAR=$(ls sql/catalyst/target/scala-2.13/spark-catalyst_2.13-*-tests.jar 2>/dev/null | head -1)
          SPARK_SQL_TEST_JAR=$(ls sql/core/target/scala-2.13/spark-sql_2.13-*-tests.jar 2>/dev/null | head -1)

          echo "Test jars found:"
          echo "  SPARK_CORE_TEST_JAR=$SPARK_CORE_TEST_JAR"
          echo "  SPARK_CATALYST_TEST_JAR=$SPARK_CATALYST_TEST_JAR"
          echo "  SPARK_SQL_TEST_JAR=$SPARK_SQL_TEST_JAR"

          # Verify required jars exist
          if [ -z "$SPARK_CORE_TEST_JAR" ] || [ ! -f "$SPARK_CORE_TEST_JAR" ]; then
            echo "ERROR: spark-core test jar not found!"
            echo "BenchmarkBase class will not be available"
            find core/target -name "*.jar" | head -10
            exit 1
          fi

          if [ -z "$SPARK_SQL_TEST_JAR" ] || [ ! -f "$SPARK_SQL_TEST_JAR" ]; then
            echo "ERROR: spark-sql test jar not found!"
            echo "TPCDSQueryBenchmark class will not be available"
            find sql/core/target -name "*.jar" | head -10
            exit 1
          fi

          # Build comma-separated jars list (include core test jar for BenchmarkBase)
          JARS_LIST=""
          if [ -n "$SPARK_CORE_TEST_JAR" ] && [ -f "$SPARK_CORE_TEST_JAR" ]; then
            JARS_LIST="$SPARK_CORE_TEST_JAR"
          fi
          if [ -n "$SPARK_CATALYST_TEST_JAR" ] && [ -f "$SPARK_CATALYST_TEST_JAR" ]; then
            if [ -n "$JARS_LIST" ]; then
              JARS_LIST="$JARS_LIST,$SPARK_CATALYST_TEST_JAR"
            else
              JARS_LIST="$SPARK_CATALYST_TEST_JAR"
            fi
          fi

          echo "Using jars: $JARS_LIST"

          # Save environment variables for subsequent steps
          echo "JDK_HOME=$JDK_HOME" >> $GITHUB_ENV
          echo "TPCDS_DATA=$TPCDS_DATA" >> $GITHUB_ENV
          echo "JARS_LIST=$JARS_LIST" >> $GITHUB_ENV
          echo "SPARK_SQL_TEST_JAR=$SPARK_SQL_TEST_JAR" >> $GITHUB_ENV

      - name: Warmup run (JIT warmup) - Uses baseline JVM options
        run: |
          export JAVA_HOME=$JDK_HOME
          export PATH=$JAVA_HOME/bin:$PATH

          cd spark-src

          echo "========================================"
          echo "Warmup Run (JIT warmup)"
          echo "========================================"
          echo "JVM Options: $BASELINE_OPTS"
          echo "Query: q3"
          echo "========================================"

          ./bin/spark-submit \
            --master local[1] \
            --driver-memory 3g \
            --conf spark.driver.extraJavaOptions="$BASELINE_OPTS" \
            --conf spark.log.level="$LOG_LEVEL" \
            --jars "$JARS_LIST" \
            --class org.apache.spark.sql.execution.benchmark.TPCDSQueryBenchmark \
            "$SPARK_SQL_TEST_JAR" \
            --data-location "$TPCDS_DATA" \
            --query-filter "q3"

          echo "✅ Warmup completed"

      - name: Run BASELINE benchmark - Uses baseline JVM options
        run: |
          export JAVA_HOME=$JDK_HOME
          export PATH=$JAVA_HOME/bin:$PATH

          cd spark-src

          echo "========================================"
          echo "TPC-DS Benchmark - BASELINE"
          echo "========================================"
          echo "JVM Options: $BASELINE_OPTS"
          echo "Queries: $QUERY_FILTER"
          echo "Log Level: $LOG_LEVEL"
          echo "Start: $(date)"
          echo "========================================"

          ./bin/spark-submit \
            --master local[1] \
            --driver-memory 3g \
            --conf spark.driver.extraJavaOptions="$BASELINE_OPTS" \
            --conf spark.log.level="$LOG_LEVEL" \
            --jars "$JARS_LIST" \
            --class org.apache.spark.sql.execution.benchmark.TPCDSQueryBenchmark \
            "$SPARK_SQL_TEST_JAR" \
            --data-location "$TPCDS_DATA" \
            --query-filter "$QUERY_FILTER" \
            | tee ../benchmark-baseline.log

          echo "End: $(date)"
          echo "✅ BASELINE benchmark completed"

      - name: Run OPTIMIZED benchmark - Uses optimized JVM options
        run: |
          export JAVA_HOME=$JDK_HOME
          export PATH=$JAVA_HOME/bin:$PATH

          cd spark-src

          echo "========================================"
          echo "TPC-DS Benchmark - OPTIMIZED"
          echo "========================================"
          echo "JVM Options: $OPTIMIZED_OPTS"
          echo "Queries: $QUERY_FILTER"
          echo "Log Level: $LOG_LEVEL"
          echo "Start: $(date)"
          echo "=========================================="

          ./bin/spark-submit \
            --master local[1] \
            --driver-memory 3g \
            --conf spark.driver.extraJavaOptions="$OPTIMIZED_OPTS" \
            --conf spark.log.level="$LOG_LEVEL" \
            --jars "$JARS_LIST" \
            --class org.apache.spark.sql.execution.benchmark.TPCDSQueryBenchmark \
            "$SPARK_SQL_TEST_JAR" \
            --data-location "$TPCDS_DATA" \
            --query-filter "$QUERY_FILTER" \
            | tee ../benchmark-optimized.log

          echo "End: $(date)"
          echo "✅ OPTIMIZED benchmark completed"

      - name: Checkout code for comparison script
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: comparison-scripts

      - name: Analyze and compare benchmark results
        if: always()
        run: |
          echo "========================================"
          echo "Analyzing Benchmark Results"
          echo "========================================"

          # Verify we're in the correct directory
          echo "Current directory: $(pwd)"
          ls -la comparison-scripts/.github/scripts/ 2>/dev/null || echo "ERROR: comparison-scripts/.github/scripts not found"

          # Check if both log files exist
          if [ ! -f benchmark-baseline.log ]; then
            echo "WARNING: baseline results not found"
            ls -la benchmark*.log 2>/dev/null || echo "No benchmark logs found"
          else
            echo "✅ Baseline results found"
          fi

          if [ ! -f benchmark-optimized.log ]; then
            echo "WARNING: optimized results not found"
            ls -la benchmark*.log 2>/dev/null || echo "No benchmark logs found"
          else
            echo "✅ Optimized results found"
          fi

          # Run the analysis
          if [ -f comparison-scripts/.github/scripts/compare_results.py ]; then
            python3 comparison-scripts/.github/scripts/compare_results.py | tee comparison_output.txt
          else
            echo "ERROR: compare_results.py not found!"
            echo "Available files:"
            find . -name "compare_results.py" 2>/dev/null || echo "Script not found anywhere"
            exit 1
          fi

      - name: Upload benchmark results and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark-baseline.log
            benchmark-optimized.log
            comparison_output.txt
            comparison_results.txt
          retention-days: 30
